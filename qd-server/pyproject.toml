[project]
name = "qd-server"
version = "25.1.0-dev"
description = "QD Server - FastAPI backend for QD2"
authors = [{ name = "a76yyyy", email = "a76yyyy@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">= 3.10, <= 3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0.0",
    "python-multipart>=0.0.17",
    "apscheduler>=3.10.0",
    "qd-core",
]

[project.scripts]
qd-server = "qd_server.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qd_server"]
