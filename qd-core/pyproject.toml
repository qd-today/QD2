[project]
name = "qd-core"
version = "25.1.0-dev"
description = "QD Core - Plugin system, HAR parser, HTTP client"
authors = [{ name = "a76yyyy", email = "a76yyyy@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">= 3.10, <= 3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "plux>=1.2.0",
    "httpx>=0.28.0",
    "babel>=2.16.0",
    "loguru>=0.7.0",
    "jinja2>=3.1.0",
    "pycryptodome>=3.20.0",
    "passlib>=1.7.4",
    "faker>=30.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qd_core"]
