[project]
name = "qd-cli"
version = "25.1.0-dev"
description = "QD CLI - Command line tool for QD2"
authors = [{ name = "a76yyyy", email = "a76yyyy@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "qd-core",
]

[project.scripts]
qd = "qd_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qd_cli"]
